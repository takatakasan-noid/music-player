<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイ音楽プレイヤー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>🎵 マイ音楽プレイヤー</h1>
  <div id="connect-bar">
    <span id="connect-status">未ログイン</span>
    <button id="connect-btn">🔐 Googleでログイン</button>
  </div>
</header>

<div id="app">
  <aside id="playlist-panel">
    <div class="panel-title">プレイリスト</div>
    <ul id="playlist-list"></ul>
    <button id="new-playlist-btn">＋ 新規プレイリスト</button>
  </aside>

  <main id="dropzone">
    <div id="dropzone-overlay">🎵 ここに曲をドロップして追加</div>
    <div class="list-header">
      <span id="current-view-title">すべての曲</span>
      <label class="add-btn" id="add-btn-label">
        ＋ 曲を追加
        <input type="file" id="file-input" accept="audio/*" multiple hidden>
      </label>
    </div>
    <div id="empty-message" style="display:none;"></div>
    <ul class="song-list" id="song-list"></ul>
  </main>
</div>

<div id="player-bar">
  <div id="now-playing">
    <span class="np-title">曲を選んでください</span>
  </div>
  <div class="seek-row">
    <span id="current-time">0:00</span>
    <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
    <span id="duration">0:00</span>
  </div>
  <div class="controls">
    <button id="repeat-btn" title="繰り返し">🔁</button>
    <button id="prev-btn" title="前の曲">⏮</button>
    <button id="play-btn" title="再生/一時停止">▶</button>
    <button id="next-btn" title="次の曲">⏭</button>
    <span class="controls-spacer"></span>
  </div>
</div>

<audio id="audio"></audio>

<script src="js/config.js"></script>
<script src="js/drive.js"></script>
<script src="js/player.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="onGisLoad()"></script>
</body>
</html>
