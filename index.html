<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My BroadCast</title>
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<header>
  <h1><span class="icon" data-icon="music"></span> My BroadCast</h1>
  <div id="connect-bar">
    <button id="connect-btn" class="round" title="Googleでログイン"><span class="icon" data-icon="lock"></span></button>
  </div>
</header>

<div id="app">
  <aside id="playlist-panel">
    <div class="panel-title-row">
      <span class="panel-title">プレイリスト</span>
      <button id="new-playlist-btn" class="icon-btn round" title="新規プレイリストを作成"><span class="icon" data-icon="plus"></span></button>
    </div>
    <ul id="playlist-list"></ul>
  </aside>

  <main id="dropzone">
    <div id="dropzone-overlay"><span class="icon" data-icon="music"></span> ここに曲をドロップして追加</div>
    <div class="list-header">
      <span id="current-view-title">すべての曲</span>
      <label class="add-btn" id="add-btn-label" title="曲を追加">
        <span class="icon" data-icon="plus"></span>
        <input type="file" id="file-input" accept="audio/*" multiple hidden>
      </label>
    </div>
    <div id="empty-message" style="display:none;"></div>
    <ul class="song-list" id="song-list"></ul>
  </main>
</div>

<div id="player-bar">
  <div id="now-playing">
    <span class="np-title">曲を選んでください</span>
  </div>
  <div class="seek-row">
    <span id="current-time">0:00</span>
    <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
    <span id="duration">0:00</span>
  </div>
  <div class="controls">
    <button id="repeat-btn" title="繰り返し"><span class="icon" data-icon="repeat"></span></button>
    <button id="prev-btn" title="前の曲"><span class="icon" data-icon="skipBack"></span></button>
    <button id="play-btn" title="再生/一時停止"><span class="icon" data-icon="play"></span></button>
    <button id="next-btn" title="次の曲"><span class="icon" data-icon="skipForward"></span></button>
    <span class="controls-spacer"></span>
  </div>
</div>

<audio id="audio"></audio>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/drive.js"></script>
<script src="js/player.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="onGisLoad()"></script>
</body>
</html>
